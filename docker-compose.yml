services:
  historian-db:
    image: timescale/timescaledb:latest-pg16
    container_name: steelmaking-level2-historian
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - historian_data:/var/lib/postgresql/data
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - level2-net

  level1-simulator:
    build:
      context: ./services/level1_simulator
    container_name: steelmaking-level2-simulator
    restart: unless-stopped
    depends_on:
      historian-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: historian-db
      DB_PORT: 5432
    networks:
      - level2-net

  heat-management:
    build:
      context: ./services/heat_management
    container_name: steelmaking-level2-heat-management
    restart: unless-stopped
    depends_on:
      historian-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: historian-db
      DB_PORT: 5432
    ports:
      - "${HEAT_MANAGEMENT_PORT:-9000}:9000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - level2-net

  level2-api:
    build:
      context: ./services/level2_api
    container_name: steelmaking-level2-api
    restart: unless-stopped
    depends_on:
      historian-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: historian-db
      DB_PORT: 5432
      DJANGO_BOOTSTRAP_USERNAME: ${DJANGO_BOOTSTRAP_USERNAME:-OP-4109}
      DJANGO_BOOTSTRAP_PASSWORD: ${DJANGO_BOOTSTRAP_PASSWORD:-Level2Demo-1405}
      DJANGO_BOOTSTRAP_DISPLAY_NAME: ${DJANGO_BOOTSTRAP_DISPLAY_NAME:-Shift Operator}
    ports:
      - "${LEVEL2_API_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - level2-net

  frontend:
    build:
      context: ./frontend
    container_name: steelmaking-level2-frontend
    restart: unless-stopped
    depends_on:
      level2-api:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/frontend-health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - level2-net

  nginx:
    image: nginx:1.27-alpine
    container_name: steelmaking-level2-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      level2-api:
        condition: service_healthy
      heat-management:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/gateway-health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - level2-net

volumes:
  historian_data:

networks:
  level2-net:
    name: steelmaking-level2-net
