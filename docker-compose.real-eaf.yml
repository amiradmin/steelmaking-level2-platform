services:
  central-opcua-server:
    command: ["sh", "-c", "python packet_monitor.py & exec python gateway.py"]
    environment:
      EAF_PLC_HOST: ${EAF_PLC_HOST:?Set EAF_PLC_HOST to the real S7-400 IP address}
      EAF_PLC_PORT: ${EAF_PLC_PORT:-102}
      EAF_PLC_RACK: ${EAF_PLC_RACK:-0}
      EAF_PLC_SLOT: ${EAF_PLC_SLOT:-2}
      OPCUA_GATEWAY_MAP_PATH: /app/s7_address_map.active.json
      OPCUA_GATEWAY_POLL_SECONDS: ${OPCUA_GATEWAY_POLL_SECONDS:-0.5}
      OPCUA_GATEWAY_RECONNECT_SECONDS: ${OPCUA_GATEWAY_RECONNECT_SECONDS:-2}
      # Hybrid development mode: LF/CCM simulators may keep the gateway healthy
      # while the physical EAF PLC is temporarily unreachable. The REAL PLC UI
      # still reports EAF as unavailable until a verified GOOD physical read exists.
      OPCUA_GATEWAY_REQUIRE_ALL_PLC: "0"
      PLC_PACKET_CAPTURE_PATH: /capture/plc_packets.json
      PLC_PACKET_RING_SIZE: ${PLC_PACKET_RING_SIZE:-30}
    volumes:
      - "${S7_ADDRESS_MAP_FILE:?Set S7_ADDRESS_MAP_FILE to a reviewed real PLC DB map}:/app/s7_address_map.active.json:ro"
      - plc_packet_capture:/capture

  plc-ingestor-central-test:
    environment:
      # Only EAF is marked REAL_S7 in this override. LF/CCM remain simulator/OPC-UA data.
      PLC_REAL_AREAS: EAF

  level2-api:
    environment:
      EAF_PLC_SOURCE: real
      EAF_PLC_MODEL: ${EAF_PLC_MODEL:-Siemens S7-400}
      EAF_PLC_HOST: ${EAF_PLC_HOST:?Set EAF_PLC_HOST to the real S7-400 IP address}
      EAF_PLC_PORT: ${EAF_PLC_PORT:-102}
      EAF_PLC_RACK: ${EAF_PLC_RACK:-0}
      EAF_PLC_SLOT: ${EAF_PLC_SLOT:-2}
      PLC_PACKET_CAPTURE_PATH: /capture/plc_packets.json
    volumes:
      - plc_packet_capture:/capture:ro

volumes:
  plc_packet_capture:

# This override intentionally leaves the EAF simulator container available but
# unused by the gateway. That keeps the normal plc-multi-test profile intact and
# makes rollback to simulation immediate: simply omit this override file.
#
# S7_ADDRESS_MAP_FILE is REQUIRED here. The simulation DB map is intentionally
# not accepted as a fallback for a physical PLC because the Live System Map must
# never present simulator/test addresses as verified plant data.
#
# Production path with this override:
#   real S7-400 EAF (ISO-on-TCP / S7, TCP/102)
#        -> Central Gateway (python-snap7, read-only DB reads + passive capture)
#        -> normalized OPC UA namespace
#        -> PLC ingestor (marks EAF samples source_kind=REAL_S7)
#        -> historian / Level 2 API / dashboard
