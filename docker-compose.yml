services:
  historian-db:
    image: timescale/timescaledb:latest-pg16
    container_name: steelmaking-level2-historian
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - historian_data:/var/lib/postgresql/data
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - level2-net

  level1-simulator:
    build:
      context: ./backend/level1_simulator
    container_name: steelmaking-level2-simulator
    restart: unless-stopped
    depends_on:
      historian-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: historian-db
      DB_PORT: 5432
    networks:
      - level2-net

  plc-ingestor:
    profiles:
      - plc
    image: steelmaking-level2-platform-plc-ingestor:latest
    build:
      context: ./backend/plc_ingestor
    container_name: steelmaking-level2-plc-ingestor
    restart: unless-stopped
    depends_on:
      historian-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: historian-db
      DB_PORT: 5432
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - level2-net

  opcua-simulator:
    profiles:
      - plc-test
    image: steelmaking-level2-platform-plc-ingestor:latest
    container_name: steelmaking-level2-opcua-simulator
    restart: unless-stopped
    command: ["python", "opcua_simulator.py"]
    healthcheck:
      disable: true
    ports:
      - "${OPCUA_TEST_PORT:-4841}:4840"
    networks:
      - level2-net

  eaf-plc-simulator:
    profiles:
      - plc-multi-test
    image: steelmaking-level2-platform-plc-simulators:latest
    build:
      context: ./backend/plc_simulators
    container_name: steelmaking-level2-eaf-plc-simulator
    restart: unless-stopped
    command: ["python", "eaf_simulator.py"]
    environment:
      PLC_SIM_SCAN_SECONDS: ${PLC_SIM_SCAN_SECONDS:-0.1}
      PLC_SIM_TIME_SCALE: ${PLC_SIM_TIME_SCALE:-60}
      PLC_SIM_EPOCH_UNIX: ${PLC_SIM_EPOCH_UNIX:-1788220800}
      PLC_SIM_HEAT_BASE: ${PLC_SIM_HEAT_BASE:-260001}
      PLC_SIM_HEAT_PITCH_MINUTES: ${PLC_SIM_HEAT_PITCH_MINUTES:-70}
      PLC_SIM_CPU_MODE: ${EAF_PLC_SIM_CPU_MODE:-RUN}
      PLC_SIM_FAULT_MODE: ${EAF_PLC_SIM_FAULT_MODE:-NONE}
      PLC_SIM_S7_ENABLED: "1"
      PLC_SIM_S7_PORT: "102"
    ports:
      - "${EAF_PLC_SIM_PORT:-4842}:4840"
      - "${EAF_PLC_S7_PORT:-1102}:102"
    networks:
      - level2-net

  lf-plc-simulator:
    profiles:
      - plc-multi-test
    image: steelmaking-level2-platform-plc-simulators:latest
    container_name: steelmaking-level2-lf-plc-simulator
    restart: unless-stopped
    command: ["python", "lf_simulator.py"]
    environment:
      PLC_SIM_SCAN_SECONDS: ${PLC_SIM_SCAN_SECONDS:-0.1}
      PLC_SIM_TIME_SCALE: ${PLC_SIM_TIME_SCALE:-60}
      PLC_SIM_EPOCH_UNIX: ${PLC_SIM_EPOCH_UNIX:-1788220800}
      PLC_SIM_HEAT_BASE: ${PLC_SIM_HEAT_BASE:-260001}
      PLC_SIM_HEAT_PITCH_MINUTES: ${PLC_SIM_HEAT_PITCH_MINUTES:-70}
      PLC_SIM_CPU_MODE: ${LF_PLC_SIM_CPU_MODE:-RUN}
      PLC_SIM_FAULT_MODE: ${LF_PLC_SIM_FAULT_MODE:-NONE}
      PLC_SIM_S7_ENABLED: "1"
      PLC_SIM_S7_PORT: "102"
    ports:
      - "${LF_PLC_SIM_PORT:-4843}:4840"
      - "${LF_PLC_S7_PORT:-1103}:102"
    networks:
      - level2-net

  ccm-plc-simulator:
    profiles:
      - plc-multi-test
    image: steelmaking-level2-platform-plc-simulators:latest
    build:
      context: ./backend/plc_simulators
    container_name: steelmaking-level2-ccm-plc-simulator
    restart: unless-stopped
    command: ["python", "ccm_simulator.py"]
    environment:
      PLC_SIM_SCAN_SECONDS: ${PLC_SIM_SCAN_SECONDS:-0.1}
      PLC_SIM_TIME_SCALE: ${PLC_SIM_TIME_SCALE:-60}
      PLC_SIM_EPOCH_UNIX: ${PLC_SIM_EPOCH_UNIX:-1788220800}
      PLC_SIM_HEAT_BASE: ${PLC_SIM_HEAT_BASE:-260001}
      PLC_SIM_HEAT_PITCH_MINUTES: ${PLC_SIM_HEAT_PITCH_MINUTES:-70}
      PLC_SIM_CPU_MODE: ${CCM_PLC_SIM_CPU_MODE:-RUN}
      PLC_SIM_FAULT_MODE: ${CCM_PLC_SIM_FAULT_MODE:-NONE}
      PLC_SIM_S7_ENABLED: "1"
      PLC_SIM_S7_PORT: "102"
    ports:
      - "${CCM_PLC_SIM_PORT:-4844}:4840"
      - "${CCM_PLC_S7_PORT:-1104}:102"
    networks:
      - level2-net

  central-opcua-server:
    profiles:
      - plc-multi-test
    image: steelmaking-level2-platform-central-opcua:latest
    build:
      context: ./backend
      dockerfile: opcua_gateway/Dockerfile
    container_name: steelmaking-level2-central-opcua
    restart: unless-stopped
    command: ["sh", "-c", "python packet_monitor.py & exec python gateway.py"]
    depends_on:
      eaf-plc-simulator:
        condition: service_started
      lf-plc-simulator:
        condition: service_started
      ccm-plc-simulator:
        condition: service_started
    environment:
      EAF_PLC_HOST: eaf-plc-simulator
      EAF_PLC_PORT: "102"
      EAF_PLC_RACK: "0"
      EAF_PLC_SLOT: "2"
      LF_PLC_HOST: lf-plc-simulator
      LF_PLC_PORT: "102"
      LF_PLC_RACK: "0"
      LF_PLC_SLOT: "2"
      CCM_PLC_HOST: ccm-plc-simulator
      CCM_PLC_PORT: "102"
      CCM_PLC_RACK: "0"
      CCM_PLC_SLOT: "2"
      OPCUA_GATEWAY_POLL_SECONDS: ${OPCUA_GATEWAY_POLL_SECONDS:-0.5}
      OPCUA_GATEWAY_RECONNECT_SECONDS: ${OPCUA_GATEWAY_RECONNECT_SECONDS:-2}
      OPCUA_GATEWAY_REQUIRE_ALL_PLC: "1"
      PLC_PACKET_CAPTURE_PATH: /capture/plc_packets.json
      PLC_PACKET_RING_SIZE: ${PLC_PACKET_RING_SIZE:-30}
    ports:
      - "${CENTRAL_OPCUA_PORT:-4845}:4840"
    volumes:
      - plc_packet_capture:/capture
    networks:
      - level2-net

  plc-ingestor-central-test:
    profiles:
      - plc-multi-test
    image: steelmaking-level2-platform-plc-ingestor:latest
    build:
      context: ./backend/plc_ingestor
    container_name: steelmaking-level2-plc-ingestor-central-test
    restart: unless-stopped
    depends_on:
      historian-db:
        condition: service_healthy
      central-opcua-server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: historian-db
      DB_PORT: 5432
      PLC_OPCUA_ENDPOINT: opc.tcp://central-opcua-server:4840/steelmaking/
      PLC_OPCUA_USERNAME: ""
      PLC_OPCUA_PASSWORD: ""
      PLC_POLL_INTERVAL_SECONDS: 1
      PLC_RECONNECT_DELAY_SECONDS: 2
      PLC_NODE_MAP_JSON: >-
        {"EAF.PowerMW":"ns=2;s=EAF.PowerMW","EAF.CurrentKA":"ns=2;s=EAF.CurrentKA","EAF.OxygenFlow":"ns=2;s=EAF.OxygenFlow","EAF.SteelTemperature":"ns=2;s=EAF.SteelTemperature","EAF.ElectrodePositionPercent":"ns=2;s=EAF.ElectrodePositionPercent","EAF.CoolingWaterFlowM3h":"ns=2;s=EAF.CoolingWaterFlowM3h","EAF.TransformerTap":"ns=2;s=EAF.TransformerTap","EAF.StageCode":"ns=2;s=EAF.StageCode","EAF.HeatNumber":"ns=2;s=EAF.HeatNumber","EAF.Ready":"ns=2;s=EAF.Ready","EAF.Running":"ns=2;s=EAF.Running","EAF.Fault":"ns=2;s=EAF.Fault","EAF.AlarmCode":"ns=2;s=EAF.AlarmCode","EAF.ArcOn":"ns=2;s=EAF.ArcOn","EAF.OxygenOn":"ns=2;s=EAF.OxygenOn","EAF.BurnerOn":"ns=2;s=EAF.BurnerOn","EAF.RoofClosed":"ns=2;s=EAF.RoofClosed","EAF.DoorClosed":"ns=2;s=EAF.DoorClosed","EAF.HydraulicOK":"ns=2;s=EAF.HydraulicOK","EAF.CoolingWaterOK":"ns=2;s=EAF.CoolingWaterOK","EAF.TransformerReady":"ns=2;s=EAF.TransformerReady","EAF.InterlockOK":"ns=2;s=EAF.InterlockOK","EAF.PLC.ScanCounter":"ns=2;s=EAF.PLC.ScanCounter","EAF.PLC.CycleTimeMs":"ns=2;s=EAF.PLC.CycleTimeMs","EAF.PLC.WatchdogOK":"ns=2;s=EAF.PLC.WatchdogOK","EAF.PLC.CommsOK":"ns=2;s=EAF.PLC.CommsOK","EAF.PLC.Heartbeat":"ns=2;s=EAF.PLC.Heartbeat","LF.SteelTemperature":"ns=2;s=LF.SteelTemperature","LF.ArgonFlow":"ns=2;s=LF.ArgonFlow","LF.StageCode":"ns=2;s=LF.StageCode","LF.HeatNumber":"ns=2;s=LF.HeatNumber","CCM.CastingSpeed":"ns=2;s=CCM.CastingSpeed","CCM.TundishTemperature":"ns=2;s=CCM.TundishTemperature","CCM.StageCode":"ns=2;s=CCM.StageCode","CCM.HeatNumber":"ns=2;s=CCM.HeatNumber"}
    networks:
      - level2-net

  plc-ingestor-test:
    profiles:
      - plc-test
    image: steelmaking-level2-platform-plc-ingestor:latest
    container_name: steelmaking-level2-plc-ingestor-test
    restart: unless-stopped
    depends_on:
      historian-db:
        condition: service_healthy
      opcua-simulator:
        condition: service_started
    env_file:
      - .env
    environment:
      DB_HOST: historian-db
      DB_PORT: 5432
      PLC_OPCUA_ENDPOINT: opc.tcp://opcua-simulator:4840/steelmaking/
      PLC_OPCUA_USERNAME: ""
      PLC_OPCUA_PASSWORD: ""
      PLC_POLL_INTERVAL_SECONDS: 1
      PLC_RECONNECT_DELAY_SECONDS: 2
      PLC_NODE_MAP_JSON: >-
        {"EAF.PowerMW":"ns=2;s=EAF.PowerMW","EAF.CurrentKA":"ns=2;s=EAF.CurrentKA","EAF.OxygenFlow":"ns=2;s=EAF.OxygenFlow","EAF.SteelTemperature":"ns=2;s=EAF.SteelTemperature","LF.SteelTemperature":"ns=2;s=LF.SteelTemperature","LF.ArgonFlow":"ns=2;s=LF.ArgonFlow","CCM.CastingSpeed":"ns=2;s=CCM.CastingSpeed","CCM.TundishTemperature":"ns=2;s=CCM.TundishTemperature"}
    networks:
      - level2-net

  heat-management:
    build:
      context: ./backend/heat_management
    container_name: steelmaking-level2-heat-management
    restart: unless-stopped
    depends_on:
      historian-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: historian-db
      DB_PORT: 5432
    ports:
      - "${HEAT_MANAGEMENT_PORT:-9000}:9000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - level2-net

  level2-api:
    build:
      context: ./backend/level2_api
    container_name: steelmaking-level2-api
    restart: unless-stopped
    depends_on:
      historian-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: historian-db
      DB_PORT: 5432
      PLC_SIM_TIME_SCALE: ${PLC_SIM_TIME_SCALE:-60}
      PLC_SIM_HEAT_PITCH_MINUTES: ${PLC_SIM_HEAT_PITCH_MINUTES:-70}
      DJANGO_BOOTSTRAP_USERNAME: ${DJANGO_BOOTSTRAP_USERNAME:-OP-4109}
      DJANGO_BOOTSTRAP_PASSWORD: ${DJANGO_BOOTSTRAP_PASSWORD:-Level2Demo-1405}
      DJANGO_BOOTSTRAP_DISPLAY_NAME: ${DJANGO_BOOTSTRAP_DISPLAY_NAME:-Shift Operator}
      DJANGO_BOOTSTRAP_ROLE: ${DJANGO_BOOTSTRAP_ROLE:-ADMINISTRATOR}
      PLC_PACKET_CAPTURE_PATH: /capture/plc_packets.json
    ports:
      - "${LEVEL2_API_PORT:-8080}:8080"
    volumes:
      - plc_packet_capture:/capture:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - level2-net

  frontend:
    build:
      context: ./frontend
    container_name: steelmaking-level2-frontend
    restart: unless-stopped
    depends_on:
      level2-api:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/frontend-health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - level2-net

  nginx:
    image: nginx:1.27-alpine
    container_name: steelmaking-level2-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      level2-api:
        condition: service_healthy
      heat-management:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/gateway-health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - level2-net

volumes:
  historian_data:
  plc_packet_capture:

networks:
  level2-net:
    name: steelmaking-level2-net
